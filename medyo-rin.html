<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-Hydro Energy System - Upgraded</title>

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s;
}
body.dark { background:#121212; color:#fff; }

#loginPage { display:flex; justify-content:center; align-items:center; height:100vh; background:linear-gradient(120deg,#4facfe,#00f2fe);}
.login-container { background:#fff; padding:40px 30px; border-radius:15px; box-shadow:0 6px 20px rgba(0,0,0,0.2); text-align:center;}
.login-container input{ width:100%; margin:10px 0; padding:12px; border-radius:8px; border:1px solid #ccc;}
.login-container button{ width:100%; padding:12px; border:none; border-radius:8px; background:#4facfe; color:white; font-weight:bold; cursor:pointer; margin-top:10px;}

#dashboardPage { display:none; }
.header { background:linear-gradient(90deg,#00c6ff,#0072ff); color:white; padding:20px; text-align:center; font-size:26px; font-weight:bold;}
.controls { display:flex; justify-content:space-between; padding:10px 20px;}
.controls button { padding:10px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:bold;}
#logoutBtn{ background:#ff5f6d; color:white;}
#darkModeBtn{ background:#222; color:white;}

.stats-container { display:flex; flex-wrap:wrap; gap:20px; padding:20px;}
.card { flex:1 1 250px; background:#fff; border-radius:15px; padding:20px; box-shadow:0 4px 15px rgba(0,0,0,0.1); transition:transform 0.3s; text-align:center;}
body.dark .card{ background:#1f1f1f;}
.card:hover{ transform:translateY(-5px);}
.card h3{ margin-bottom:15px;}
.card .value{ font-size:28px; font-weight:bold; color:#0072ff;}

#chartContainer { background:#fff; padding:20px; border-radius:15px; margin:20px;}
body.dark #chartContainer { background:#1f1f1f; }

#mapPanel { padding:20px;}
#mapToggleBtn { padding:10px 16px; border-radius:8px; border:none; background:#0072ff; color:white; cursor:pointer;}
#searchBar { margin:10px 0; padding:10px; width:300px; border-radius:8px; border:1px solid #ccc; display:none;}
#map { height:500px; width:100%; border-radius:15px; display:none; transition:all 0.5s;}

#logTable { width:100%; border-collapse:collapse; margin-top:20px;}
#logTable th, #logTable td { border:1px solid #ccc; padding:8px; text-align:center;}
#logTable th{ background:#0072ff; color:white;}
body.dark #logTable th{ background:#444;}
body.dark #logTable td{ color:#fff; border-color:#555;}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
    <div class="login-container">
        <h2>Micro-Hydro Energy System</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <select id="role">
            <option value="admin">Admin</option>
            <option value="operator">Operator</option>
            <option value="viewer">Viewer</option>
        </select>
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- DASHBOARD PAGE -->
<div id="dashboardPage">
    <div class="header">Micro-Hydro Energy Dashboard</div>
    <div class="controls">
        <button id="darkModeBtn" onclick="toggleDark()">Toggle Dark Mode</button>
        <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>

    <div class="stats-container">
        <div class="card">
            <h3>Electricity Gained Today</h3>
            <div class="value" id="todayValue">0 kWh</div>
        </div>
        <div class="card">
            <h3>Current Power Output</h3>
            <div class="value" id="powerValue">0 W</div>
        </div>
        <div class="card" id="chartContainer">
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>

    <div id="mapPanel">
        <button id="mapToggleBtn" onclick="toggleMap()">Show Map of Hagonoy</button>
        <br>
        <input type="text" id="searchBar" placeholder="Search Barangay...">
        <div id="map"></div>
    </div>

    <div id="logSection">
        <h3>Electricity History Logs</h3>
        <table id="logTable">
            <thead>
                <tr><th>Time</th><th>Electricity (kWh)</th><th>Power (W)</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
/* ===== LOGIN ===== */
function login(){
    const user=document.getElementById("username").value;
    const pass=document.getElementById("password").value;
    if(!user || !pass){ alert("Enter login details"); return;}
    const role=document.getElementById("role").value;
    localStorage.setItem("role",role);
    loginPage.style.display="none"; dashboardPage.style.display="block";
}

/* ===== LOGOUT ===== */
function logout(){ dashboardPage.style.display="none"; loginPage.style.display="flex"; }

/* ===== DARK MODE ===== */
function toggleDark(){ document.body.classList.toggle("dark"); }

/* ===== LIVE VALUES + LOGS ===== */
const logTbody=document.querySelector("#logTable tbody");
function addLog(time,val,power){
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${time}</td><td>${val.toFixed(2)}</td><td>${power}</td>`;
    if(localStorage.getItem("role")==="viewer") tr.style.display="none";
    logTbody.prepend(tr);
}

setInterval(()=>{
    const val=Math.random()*6; const power=Math.floor(Math.random()*600);
    document.getElementById("todayValue").innerText=val.toFixed(2)+" kWh";
    document.getElementById("powerValue").innerText=power+" W";
    addLog(new Date().toLocaleTimeString(),val,power);
},5000);

/* ===== CHART ===== */
const ctx=document.getElementById("chartCanvas");
const chart=new Chart(ctx,{type:'line',data:{labels:["0","1","2","3","4","5","6"],datasets:[{label:"Power Output (W)",data:[100,200,150,250,200,300,280],borderColor:"#0072ff",fill:false,tension:0.3}]},options:{responsive:true}});

/* ===== MAP WITH POLYGONS ===== */
let mapShown=false; let map; let polygons=[];
const barangays={
"Abulalas":[14.8239,120.7424],"Carillo":[14.8341,120.7353],"Iba":[14.8382,120.7229],
"Iba-Ibayo":[14.8422,120.7270],"Mercado":[14.8358,120.7442],"Palapat":[14.8299,120.7315],
"Pugad":[14.8301,120.7405],"Sagrada Familia":[14.8170,120.7438],"San Agustin":[14.8342,120.7391],
"San Isidro":[14.8432,120.7329],"San Jose":[14.8296,120.7312],"San Juan":[14.8661,120.7414],
"San Miguel":[14.8465,120.7418],"San Nicolas":[14.8236,120.7272],"San Pablo":[14.8265,120.7421],
"San Pascual":[14.8390,120.7464],"San Pedro":[14.8408,120.7632],"San Roque":[14.8471,120.7368],
"San Sebastian":[14.8321,120.7322],"Santa Cruz":[14.8311,120.7364],"Santa Elena":[14.8364,120.7332],
"Santa Monica":[14.8314,120.7392],"Santo Niño":[14.8374,120.7350],"Santo Rosario":[14.8361,120.7291],
"Tampok":[14.8251,120.7382],"Tibaguin":[14.8212,120.7481]
};

function toggleMap(){
    const mapDiv=document.getElementById("map");
    const searchInput=document.getElementById("searchBar");
    if(!mapShown){ mapDiv.style.display="block"; searchInput.style.display="block"; mapToggleBtn.innerText="Hide Map"; if(!map) initMap();}
    else{ mapDiv.style.display="none"; searchInput.style.display="none"; mapToggleBtn.innerText="Show Map of Hagonoy"; }
    mapShown=!mapShown;
}

function initMap(){
    map=L.map("map").setView([14.8355,120.7335],12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);

    Object.entries(barangays).forEach(([name,coords])=>{
        const poly=L.polygon([
            [coords[0]+0.001, coords[1]-0.001],
            [coords[0]+0.001, coords[1]+0.001],
            [coords[0]-0.001, coords[1]+0.001],
            [coords[0]-0.001, coords[1]-0.001]
        ],{color:"#0072ff",fillColor:"#0072ff",fillOpacity:0.2}).addTo(map);
        poly.bindPopup(name);
        poly.on("click",()=>{ map.setView(coords,15); poly.openPopup(); });
        polygons.push(poly);
    });

    document.getElementById("searchBar").addEventListener("input",function(){
        const q=this.value.toLowerCase();
        Object.entries(barangays).forEach(([name,coords])=>{
            if(name.toLowerCase().includes(q)){ map.setView(coords,15); }
        });
    });
}
</script>

</body>
</html>
